services:
  omnimesh-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: omnimesh
      POSTGRES_PASSWORD: omnimesh
      POSTGRES_DB: omnimesh
    ports:
      - "5432:5432"
    volumes:
      - omnimesh-db-data:/var/lib/postgresql/data
      - ./hub/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnimesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  omnimesh-hub:
    build: ./hub
    depends_on:
      omnimesh-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://omnimesh:omnimesh@omnimesh-db:5432/omnimesh
      AGENT_TOKEN: ${AGENT_TOKEN:-dev-only-token}
      PORT: "4000"
    ports:
      - "4000:4000"
    restart: unless-stopped

  omnimesh-dashboard:
    build: ./dashboard
    depends_on:
      - omnimesh-hub
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  omnimesh-db-data:
