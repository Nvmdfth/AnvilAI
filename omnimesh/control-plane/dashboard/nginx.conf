server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors vite.config.ts's dev-server proxy: strip /api, forward to
    # the hub. Container-to-container name (see docker-compose.yml),
    # not localhost - this runs inside the dashboard's own container.
    location /api/ {
        proxy_pass http://omnimesh-hub:4000/;
    }

    location /ws {
        proxy_pass http://omnimesh-hub:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri /index.html;
    }
}
